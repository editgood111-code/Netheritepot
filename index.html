<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetheritePot | Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #0c0718;
            --bg-card: rgba(26, 17, 43, 0.85);
            --bg-strip: rgba(38, 26, 61, 0.9);
            --border: rgba(168, 85, 247, 0.3);
            --border-hover: rgba(216, 180, 254, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #c084fc;
            
            --t1: #ef4444; 
            --t2: #f97316; 
            --t3: #eab308; 
            --t4: #22c55e; 
            --t5: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            min-height: 100vh;
            background-color: var(--bg-app);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(126, 34, 206, 0.5) 0%, rgba(76, 29, 149, 0.25) 40%, transparent 75%),
                radial-gradient(circle at 100% 100%, rgba(88, 28, 135, 0.35) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
        }

        .navbar {
            height: 70px; 
            background: rgba(18, 11, 31, 0.9);
            border-bottom: 1px solid var(--border);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 0 24px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            backdrop-filter: blur(12px);
        }

        .nav-brand { 
            font-weight: 900; 
            font-size: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-brand img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .nav-right-group { display: flex; align-items: center; gap: 12px; }
        .nav-links { display: flex; gap: 6px; }

        .nav-item { 
            padding: 8px 16px; 
            border-radius: 10px; 
            color: var(--text-muted); 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 13px; 
            transition: all 0.2s ease; 
        }

        .nav-item:hover { color: #fff; background: rgba(168, 85, 247, 0.2); }
        .nav-item.active { 
            background: rgba(168, 85, 247, 0.35); 
            color: #fff; 
            border: 1px solid var(--border); 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
        }

        .discord-btn {
            background: #5865F2; 
            color: white; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            padding: 8px 14px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 13px;
            transition: 0.2s ease;
        }

        .discord-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px; 
        }

        .search-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            gap: 15px;
            flex-wrap: wrap;
        }

        .view-label { 
            font-size: 24px; 
            font-weight: 900; 
            letter-spacing: -0.5px;
        }

        .search-input { 
            width: 100%;
            max-width: 320px; 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            padding: 12px 18px; 
            border-radius: 12px; 
            color: #fff; 
            outline: none; 
            transition: 0.2s ease; 
            backdrop-filter: blur(8px);
        }

        .search-input:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
        }

        .rank-item { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            padding: 16px 20px; 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            margin-bottom: 12px; 
            transition: all 0.2s ease; 
            cursor: pointer; 
            backdrop-filter: blur(8px);
        }

        .rank-item:hover { 
            transform: translateY(-2px); 
            border-color: var(--border-hover); 
            background: rgba(45, 28, 77, 0.9); 
            box-shadow: 0 10px 25px rgba(126, 34, 206, 0.3);
        }

        .rank-pos { 
            font-size: 22px; 
            font-weight: 900; 
            width: 40px; 
            text-align: center; 
            color: var(--text-muted); 
        }

        .p-title { 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-top: 4px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }

        .title-1 { color: #facc15; } 
        .title-2 { color: #d8b4fe; } 
        .title-3 { color: #60a5fa; } 
        .title-4 { color: #a1a1aa; }

        .tier-grid-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 15px;
        }

        .tier-grid { 
            display: grid; 
            grid-template-columns: repeat(5, minmax(210px, 1fr)); 
            gap: 16px; 
            min-width: 950px;
        }

        .tier-col { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            overflow: hidden; 
            height: fit-content; 
            padding-bottom: 10px; 
            backdrop-filter: blur(8px);
        }

        .col-header { 
            padding: 12px; 
            text-align: center; 
            font-weight: 900; 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .player-strip { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding: 10px; 
            margin: 6px 8px; 
            background: var(--bg-strip); 
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease; 
        }

        .player-strip:hover { 
            background: rgba(168, 85, 247, 0.3); 
            border-color: var(--border-hover);
        }

        .modal-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(8, 4, 18, 0.85); 
            backdrop-filter: blur(12px); 
            z-index: 200; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            padding: 20px;
        }

        .modal-overlay.open { 
            display: flex; 
            opacity: 1; 
        }

        .modal-card { 
            width: 100%;
            max-width: 400px; 
            background: #1a0f2e; 
            border: 1px solid var(--border-hover); 
            border-radius: 28px; 
            padding: 35px 25px; 
            text-align: center; 
            position: relative; 
            box-shadow: 0 25px 60px rgba(126, 34, 206, 0.5);
        }

        .modal-bust { 
            width: 130px; 
            height: 130px;
            object-fit: contain;
            margin-bottom: 10px; 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); 
        }

        .modal-tier-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            padding: 6px 16px; 
            border-radius: 10px; 
            font-weight: 900; 
            font-size: 13px; 
            margin: 12px 0 20px; 
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        .modal-tier-badge img {
            width: 16px;
            height: 16px;
        }

        .modal-stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        .m-stat-box { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border); 
            padding: 14px; 
            border-radius: 16px; 
        }

        .m-stat-label { 
            font-size: 10px; 
            color: var(--text-muted); 
            font-weight: 800; 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 4px; 
        }

        .m-stat-val { 
            font-size: 18px; 
            font-weight: 900; 
        }

        @media (max-width: 640px) {
            .navbar { padding: 0 16px; }
            .nav-brand { font-size: 17px; }
            .discord-btn span { display: none; }
            .search-row { flex-direction: column; align-items: stretch; }
            .search-input { max-width: 100%; }
        }
    </style>
</head>
