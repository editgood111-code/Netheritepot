<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetheritePot | Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #09090b; --bg-card: #131316; --bg-strip: #1c1c21;
            --border: #27272a; --text-main: #fafafa; --text-muted: #a1a1aa; --accent: #ef4444;
            --t1: #ef4444; --t2: #f97316; --t3: #eab308; --t4: #22c55e; --t5: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-app); color: var(--text-main); font-family: 'Inter', sans-serif; }
        .navbar { height: 70px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .nav-brand { font-weight: 900; font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .nav-right-group { display: flex; align-items: center; gap: 15px; }
        .nav-links { display: flex; gap: 5px; }
        .nav-item { padding: 10px 18px; border-radius: 10px; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-item.active { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border); }
        .discord-btn { background: #5865F2; color: white; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.2s; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .search-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .view-label { font-size: 24px; font-weight: 800; }
        .search-input { width: 300px; background: var(--bg-card); border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; color: #fff; outline: none; }
        .rank-item { display: flex; align-items: center; gap: 20px; padding: 18px 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 12px; transition: 0.2s; cursor: pointer; }
        .rank-item:hover { transform: translateY(-2px); border-color: #3f3f46; background: #1a1a1e; }
        .rank-pos { font-size: 26px; font-weight: 900; width: 50px; text-align: center; color: var(--text-muted); }
        .p-title { font-size: 11px; font-weight: 800; text-transform: uppercase; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
        .title-1 { color: #facc15; } .title-2 { color: #f87171; } .title-3 { color: #60a5fa; } .title-4 { color: #a1a1aa; }
        .tier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
        .tier-col { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; height: fit-content; padding-bottom: 10px; }
        .col-header { padding: 14px; text-align: center; font-weight: 900; font-size: 12px; text-transform: uppercase; }
        .player-strip { display: flex; align-items: center; gap: 10px; padding: 10px; margin: 6px 10px; background: var(--bg-strip); border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 200; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-card { width: 420px; background: #18181b; border: 1px solid var(--border); border-radius: 35px; padding: 45px; text-align: center; position: relative; }
        .modal-bust { width: 150px; margin-bottom: 15px; }
        .modal-tier-badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 12px; font-weight: 900; font-size: 14px; margin-bottom: 25px; }
        .modal-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .m-stat-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 18px; border-radius: 20px; }
        .m-stat-label { font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 6px; }
        .m-stat-val { font-size: 20px; font-weight: 900; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">NETHERITEPOT</div>
        <div class="nav-right-group">
            <div class="nav-links">
                <div class="nav-item active" id="btn-overall" onclick="switchView('overall')">Top 10</div>
                <div class="nav-item" id="btn-nethpot" onclick="switchView('nethpot')">All Players</div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="search-row">
            <h2 id="view-title" class="view-label">Top 10</h2>
            <input type="text" id="search" class="search-input" placeholder="Search player..." onkeyup="renderViews()">
        </div>
        <div id="view-overall"></div>
        <div id="view-nethpot" style="display:none" class="tier-grid"></div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-card">
            <img id="m-bust" class="modal-bust" src="">
            <h2 id="m-name" style="font-size: 34px; font-weight: 800;"></h2>
            <div id="m-tier-pill" class="modal-tier-badge"></div>
            <div class="modal-stats-grid">
                <div class="m-stat-box"><span class="m-stat-label">Points</span><span id="m-pts" class="m-stat-val"></span></div>
                <div class="m-stat-box"><span class="m-stat-label">Region</span><span id="m-region" class="m-stat-val"></span></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3FWTZ587KxVbe1POuw-2Rk5FSrcpZ_QU",
            authDomain: "tierlist-3305a.firebaseapp.com",
            databaseURL: "https://tierlist-3305a-default-rtdb.firebaseio.com",
            projectId: "tierlist-3305a",
            storageBucket: "tierlist-3305a.firebasestorage.app",
            messagingSenderId: "410709885310",
            appId: "1:410709885310:web:ceab1ca94e0f45513f332f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.players = [];
        window.activeTab = 'overall';
        const POINT_MAP = { "HT1": 60, "LT1": 45, "HT2": 30, "LT2": 20, "HT3": 10, "LT3": 6, "HT4": 4, "LT4": 3, "HT5": 2, "LT5": 1 };

        // AUTO-DISCOVERY: Listen to the ROOT of the database
        onValue(ref(db, '/'), (snapshot) => {
            const rawData = snapshot.val();
            console.log("Raw Database Content:", rawData);

            if (!rawData) {
                console.error("Database is totally empty!");
                return;
            }

            // Logic to find where the players are hiding
            let foundPlayers = [];
            if (rawData.players) {
                foundPlayers = Object.values(rawData.players);
            } else {
                // If they aren't in a folder, assume the root IS the player list
                foundPlayers = Object.values(rawData);
            }

            window.players = foundPlayers.filter(p => p && typeof p === 'object' && p.name);
            console.log("Processed Players:", window.players);
            renderViews();
        }, (err) => {
            console.error("Firebase Error:", err.message);
            alert("Firebase Error: " + err.message + ". Check your Security Rules!");
        });

        window.switchView = (tab) => {
            window.activeTab = tab;
            document.getElementById('view-overall').style.display = tab === 'overall' ? 'block' : 'none';
            document.getElementById('view-nethpot').style.display = tab === 'nethpot' ? 'grid' : 'none';
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            renderViews();
        };

        window.renderViews = () => {
            const query = document.getElementById("search").value.toLowerCase();
            const processed = window.players.map(p => {
                const tier = (p.tier || "LT5").toUpperCase();
                return { ...p, pts: POINT_MAP[tier] || 0, tier: tier };
            }).filter(p => p.name.toLowerCase().includes(query));

            // Render Overall
            const ov = document.getElementById("view-overall");
            ov.innerHTML = processed.sort((a,b) => b.pts - a.pts).slice(0,10).map((p, i) => `
                <div class="rank-item" onclick="openModal('${p.name}', '${p.tier}', ${p.pts}, '${p.region}')">
                    <div class="rank-pos">#${i+1}</div>
                    <img src="https://mc-heads.net/avatar/${p.name}/40">
                    <div style="flex-grow:1"><span style="font-weight:800">${p.name}</span></div>
                    <div style="text-align:right"><span style="font-size:20px; font-weight:900;">${p.pts}</span></div>
                </div>`).join('');

            // Render Grid
            const grid = document.getElementById("view-nethpot");
            grid.innerHTML = [1,2,3,4,5].map(n => `
                <div class="tier-col">
                    <div class="col-header" style="background:var(--t${n})">Tier ${n}</div>
                    ${processed.filter(p => p.tier.includes(n)).map(p => `
                        <div class="player-strip" onclick="openModal('${p.name}','${p.tier}',${p.pts},'${p.region}')">
                            <img src="https://mc-heads.net/avatar/${p.name}/20"> ${p.name}
                        </div>`).join('')}
                </div>`).join('');
        };

        window.openModal = (name, tier, pts, region) => {
            document.getElementById("m-name").innerText = name;
            document.getElementById("m-pts").innerText = pts;
            document.getElementById("m-region").innerText = region || "Global";
            document.getElementById("m-tier-pill").innerText = tier;
            document.getElementById("m-tier-pill").style.background = `var(--t${tier.match(/\d/)[0]})`;
            document.getElementById("m-bust").src = `https://render.crafty.gg/3d/bust/${name}`;
            document.getElementById("modal-overlay").classList.add("open");
        };

        window.closeModal = (e) => { if(e.target.id === 'modal-overlay') e.target.classList.remove("open"); };
    </script>
</body>
</html>
