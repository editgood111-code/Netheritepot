<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetheritePot | Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #0c0718;
            --bg-card: rgba(26, 17, 43, 0.85);
            --bg-strip: rgba(38, 26, 61, 0.9);
            --border: rgba(168, 85, 247, 0.3);
            --border-hover: rgba(216, 180, 254, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #c084fc;
            
            --t1: #ef4444; 
            --t2: #f97316; 
            --t3: #eab308; 
            --t4: #22c55e; 
            --t5: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            min-height: 100vh;
            background-color: var(--bg-app);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(126, 34, 206, 0.5) 0%, rgba(76, 29, 149, 0.25) 40%, transparent 75%),
                radial-gradient(circle at 100% 100%, rgba(88, 28, 135, 0.35) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
        }

        .navbar {
            height: 70px; 
            background: rgba(18, 11, 31, 0.9);
            border-bottom: 1px solid var(--border);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 0 24px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            backdrop-filter: blur(12px);
        }

        .nav-brand { 
            font-weight: 900; 
            font-size: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-brand img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .nav-right-group { display: flex; align-items: center; gap: 12px; }
        .nav-links { display: flex; gap: 6px; }

        .nav-item { 
            padding: 8px 16px; 
            border-radius: 10px; 
            color: var(--text-muted); 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 13px; 
            transition: all 0.2s ease; 
        }

        .nav-item:hover { color: #fff; background: rgba(168, 85, 247, 0.2); }
        .nav-item.active { 
            background: rgba(168, 85, 247, 0.35); 
            color: #fff; 
            border: 1px solid var(--border); 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
        }

        .discord-btn {
            background: #5865F2; 
            color: white; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            padding: 8px 14px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 13px;
            transition: 0.2s ease;
        }

        .discord-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px; 
        }

        .search-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            gap: 15px;
            flex-wrap: wrap;
        }
